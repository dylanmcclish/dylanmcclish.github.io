<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}Dylan McClish</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}" />
  <meta name="author" content="Dylan McClish" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #222;
      background: #fff;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    header.site-header {
      margin-bottom: 50px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 20px;
    }
    header.site-header .site-title {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #222;
      text-decoration: none;
    }
    header.site-header nav {
      display: flex;
      gap: 16px;
    }
    header.site-header nav a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 0.95rem;
    }
    header.site-header nav a:hover { text-decoration: underline; }

    main h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }
    main .post-meta {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 32px;
    }
    main article {
      font-size: 1rem;
      color: #222;
    }
    main article p { margin-bottom: 16px; }
    main article h2 { font-size: 1.3rem; margin: 32px 0 12px; }
    main article h3 { font-size: 1.1rem; margin: 24px 0 10px; }
    main article a { color: #1a73e8; text-decoration: none; }
    main article a:hover { text-decoration: underline; }
    main article ul, main article ol { margin: 0 0 16px 24px; }
    main article code {
      background: #f5f5f5;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.88em;
    }
    main article pre {
      background: #f5f5f5;
      padding: 14px 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    main article pre code { background: none; padding: 0; }
    main article blockquote {
      border-left: 3px solid #e5e5e5;
      padding-left: 16px;
      color: #555;
      margin-bottom: 16px;
    }
    main article img { max-width: 100%; }

    .post-list { list-style: none; }
    .post-list li {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid #f0f0f0;
    }
    .post-list li:last-child { border-bottom: none; }
    .post-list .post-date {
      color: #888;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .post-list h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .post-list h3 a { color: #222; text-decoration: none; }
    .post-list h3 a:hover { color: #1a73e8; }
    .post-list p { color: #444; font-size: 0.92rem; }

    footer.site-footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #e5e5e5;
      color: #999;
      font-size: 0.82rem;
    }
    footer.site-footer a { color: #999; }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">dylan mcclish</a>
    <nav>
      <a href="{{ '/' | relative_url }}">home</a>
      <a href="{{ '/blog/' | relative_url }}">my thoughts</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ 'now' | date: "%Y" }} dylan mcclish
  </footer>

</body>
</html>
